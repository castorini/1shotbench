<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anserini Prebuilt Index Evaluator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        select, button { font-size: 16px; padding: 5px; width: 100%; margin-bottom: 15px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; background: #f9f9f9; }
        .metadata { font-size: 14px; background: #fff; border: 1px solid #eee; padding: 10px; margin-top: 10px; white-space: pre-wrap; overflow-x: auto; }
        #results { margin-top: 20px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .evaluable-badge { background: #d4edda; color: #155724; padding: 2px 6px; border-radius: 3px; font-size: 12px; margin-left: 10px; }
        .catalog-badge { background: #e2e3e5; color: #383d41; padding: 2px 6px; border-radius: 3px; font-size: 12px; margin-left: 10px; }
        ul { list-style-type: none; padding-left: 0; }
        li { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Anserini Prebuilt Index Evaluator</h1>
    
    <div class="grid">
        <div>
            <h2>Index Catalog</h2>
            <p>Filter: <input type="text" id="index-filter" placeholder="e.g. cacm or msmarco" style="width: 100%; padding: 5px;"></p>
            <div id="index-list-container" style="height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: #fff;">
                <ul id="index-list">Loading indexes...</ul>
            </div>
        </div>

        <div class="card">
            <h2>Evaluation Setup</h2>
            <div id="setup-form" class="hidden">
                <p><strong>Selected Index:</strong> <span id="sel-index">None</span></p>
                <p><strong>Topics & Qrels:</strong> <span id="sel-topic">None</span></p>
                <p>
                    <label for="metric">Metric:</label>
                    <select id="metric">
                        <option value="nDCG@10">nDCG@10</option>
                        <option value="Recall@1000">Recall@1000</option>
                        <option value="MAP">MAP</option>
                    </select>
                </p>
                <button id="run-btn" style="background: #007bff; color: white; border: none; padding: 10px; cursor: pointer;">Run Evaluation</button>
                <p id="status-msg"></p>
            </div>
            <div id="setup-disabled">
                <p>Select an <em>evaluable</em> index from the catalog to configure an evaluation.</p>
            </div>
        </div>
    </div>

    <div id="results" class="hidden card">
        <h2>Evaluation Results</h2>
        <p><strong>Score:</strong> <span id="res-score" style="font-size: 24px; font-weight: bold; color: #007bff;"></span></p>
        <p><strong>Status:</strong> <span id="res-status"></span></p>
        <p><strong>Elapsed:</strong> <span id="res-elapsed"></span> ms</p>
        <p><strong>Run File:</strong> <span id="res-runfile"></span></p>
        
        <h3>Evaluation Output</h3>
        <pre class="metadata" id="res-output"></pre>
    </div>

    <script>
        let indexes = [];
        let topics = [];
        
        // Known mappings for the app (can be expanded)
        let evaluableMap = {
            'cacm': 'cacm',
            'msmarco-v1-passage': 'msmarco-v1-passage.dev'
        };

        async function init() {
            try {
                const [idxRes, topRes] = await Promise.all([
                    fetch('/api/indexes'),
                    fetch('/api/topics')
                ]);
                indexes = await idxRes.json();
                topics = await topRes.json();
                
                // Auto-discover pairs
                indexes.forEach(idx => {
                    if (!evaluableMap[idx.name]) {
                        // Check if exact match topic exists
                        if (topics.includes(idx.name)) {
                            evaluableMap[idx.name] = idx.name;
                        } else if (topics.includes(idx.name + '.dev')) {
                            evaluableMap[idx.name] = idx.name + '.dev';
                        } else if (topics.includes(idx.name + '-dev')) {
                            evaluableMap[idx.name] = idx.name + '-dev';
                        }
                    }
                });
                
                renderCatalog('');
                
                // Select cacm by default if it exists
                const cacm = indexes.find(i => i.name === 'cacm');
                if (cacm) selectIndex(cacm.name);
                
            } catch (e) {
                document.getElementById('index-list').innerHTML = '<li class="error">Failed to load catalog from server.</li>';
            }
        }

        document.getElementById('index-filter').addEventListener('input', (e) => {
            renderCatalog(e.target.value.toLowerCase());
        });

        function renderCatalog(filter) {
            const list = document.getElementById('index-list');
            list.innerHTML = '';
            
            const filtered = indexes.filter(i => i.name.toLowerCase().includes(filter));
            
            filtered.forEach(idx => {
                const isEvaluable = evaluableMap[idx.name] !== undefined;
                const li = document.createElement('li');
                li.innerHTML = `
                    <div style="font-weight: bold; cursor: pointer; color: #007bff;" onclick="selectIndex('${idx.name}')">
                        ${idx.name}
                        ${isEvaluable ? '<span class="evaluable-badge">Evaluable</span>' : '<span class="catalog-badge">Catalog-only</span>'}
                    </div>
                    <div style="font-size: 12px; color: #666;">Type: ${idx.type} | Docs: ${idx.documents || 'N/A'}</div>
                    <div style="font-size: 12px;">${idx.description}</div>
                `;
                list.appendChild(li);
            });
        }

        function selectIndex(name) {
            const isEvaluable = evaluableMap[name] !== undefined;
            const idx = indexes.find(i => i.name === name);
            
            if (isEvaluable) {
                document.getElementById('setup-form').classList.remove('hidden');
                document.getElementById('setup-disabled').classList.add('hidden');
                document.getElementById('sel-index').textContent = name;
                document.getElementById('sel-topic').textContent = evaluableMap[name];
            } else {
                document.getElementById('setup-form').classList.add('hidden');
                document.getElementById('setup-disabled').classList.remove('hidden');
            }
        }

        document.getElementById('run-btn').addEventListener('click', async () => {
            const idx = document.getElementById('sel-index').textContent;
            const top = document.getElementById('sel-topic').textContent;
            const metric = document.getElementById('metric').value;
            
            const btn = document.getElementById('run-btn');
            const msg = document.getElementById('status-msg');
            
            btn.disabled = true;
            msg.textContent = 'Running retrieval and evaluation... (this may take a moment)';
            msg.className = '';
            document.getElementById('results').classList.add('hidden');

            try {
                const res = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index: idx, topic: top, metric })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    msg.textContent = 'Evaluation complete!';
                    msg.className = 'success';
                    
                    document.getElementById('results').classList.remove('hidden');
                    document.getElementById('res-score').textContent = data.score;
                    document.getElementById('res-status').textContent = data.status;
                    document.getElementById('res-elapsed').textContent = data.elapsedMs;
                    document.getElementById('res-runfile').textContent = data.runFile;
                    document.getElementById('res-output').textContent = data.evalOutput;
                } else {
                    msg.textContent = 'Error: ' + (data.error || 'Unknown error') + '\n' + (data.details || '');
                    msg.className = 'error';
                }
            } catch (e) {
                msg.textContent = 'Error: ' + e.message;
                msg.className = 'error';
            } finally {
                btn.disabled = false;
            }
        });

        init();
    </script>
</body>
</html>
