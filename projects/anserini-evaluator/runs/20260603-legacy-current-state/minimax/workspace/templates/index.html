<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anserini Prebuilt Index Evaluator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Anserini Prebuilt Index Evaluator</h1>
            <p class="subtitle">Browse indexes, run retrieval, evaluate results</p>
        </header>

        <main>
            <!-- Status Bar -->
            <div id="status-bar" class="status-bar">
                <span id="status-text">Loading...</span>
            </div>

            <!-- Index Catalog Section -->
            <section class="section">
                <h2>Index Catalog</h2>
                <div class="filter-bar">
                    <input type="text" id="index-filter" placeholder="Filter indexes..." class="filter-input">
                    <label>
                        <input type="checkbox" id="show-evaluable-only">
                        Show evaluable only
                    </label>
                </div>
                <div id="index-list" class="index-list">
                    <div class="loading">Loading indexes...</div>
                </div>
            </section>

            <!-- Evaluation Panel -->
            <section id="eval-panel" class="section hidden">
                <h2>Run Evaluation</h2>
                <div class="eval-config">
                    <div class="config-row">
                        <label>Index:</label>
                        <span id="selected-index" class="config-value">-</span>
                    </div>
                    <div class="config-row">
                        <label>Topics:</label>
                        <span id="selected-topics" class="config-value">-</span>
                    </div>
                    <div class="config-row">
                        <label>Qrels:</label>
                        <span id="selected-qrels" class="config-value">-</span>
                    </div>
                    <div class="config-row">
                        <label for="metric-select">Metric:</label>
                        <select id="metric-select" class="metric-select">
                            <option value="">Select metric...</option>
                        </select>
                    </div>
                </div>
                <button id="run-btn" class="run-btn" disabled>Run Evaluation</button>
            </section>

            <!-- Results Section -->
            <section id="results-section" class="section hidden">
                <h2>Results</h2>
                <div id="results-content" class="results-content">
                    <!-- Results will be populated here -->
                </div>
            </section>

            <!-- Run Files Section -->
            <section class="section">
                <h2>Generated Run Files</h2>
                <div id="run-files" class="run-files">
                    <div class="loading">Loading run files...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>Powered by Anserini 
                <span id="anserini-version">-</span>
            </p>
        </footer>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loading-text">Running evaluation...</p>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
