<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anserini Evaluator Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .container { display: flex; gap: 20px; }
        .catalog { flex: 1; border: 1px solid #ccc; padding: 10px; height: 80vh; overflow-y: auto; }
        .details { flex: 1; border: 1px solid #ccc; padding: 10px; }
        .index-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; }
        .index-item:hover { background-color: #f0f0f0; }
        .index-item.evaluable { font-weight: bold; color: #0066cc; }
        .index-item.catalog-only { color: #666; }
        .index-item.selected { background-color: #e0e0ff; }
        
        .badge { display: inline-block; padding: 2px 6px; font-size: 12px; border-radius: 4px; margin-left: 10px; }
        .badge.evaluable { background-color: #e6f7ff; border: 1px solid #91d5ff; color: #096dd9; }
        .badge.catalog-only { background-color: #f5f5f5; border: 1px solid #d9d9d9; color: #595959; }
        
        #error-message { color: red; margin-bottom: 10px; }
        .hidden { display: none; }
        .loader { margin: 10px 0; font-weight: bold; color: #0066cc; }
        
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Anserini Evaluator Dashboard</h1>
    <div id="error-message" class="hidden"></div>
    
    <div class="container">
        <div class="catalog">
            <h2>Prebuilt Indexes Catalog</h2>
            <input type="text" id="search-box" placeholder="Filter indexes..." style="width: 100%; margin-bottom: 10px; padding: 5px;" onkeyup="filterCatalog()">
            <div id="index-list">Loading catalog...</div>
        </div>
        <div class="details" id="details-pane">
            <h2>Evaluation Panel</h2>
            <p>Select an index from the catalog to view details.</p>
        </div>
    </div>

    <script>
        let allIndexes = [];
        let selectedIndex = null;

        const metrics = [
            { label: 'nDCG@10', id: 'ndcg_cut.10' },
            { label: 'Recall@1000', id: 'recall.1000' },
            { label: 'MAP', id: 'map' },
            { label: 'Precision@30', id: 'P.30' }
        ];

        async function loadCatalog() {
            try {
                const response = await fetch('/api/indexes');
                if (!response.ok) throw new Error('Failed to fetch indexes');
                allIndexes = await response.json();
                renderCatalog();
                
                // Default to CACM
                const cacmIndex = allIndexes.find(i => i.name === 'cacm');
                if (cacmIndex) {
                    selectIndex(cacmIndex);
                }
            } catch (err) {
                showError(err.message);
            }
        }

        function renderCatalog(filter = '') {
            const list = document.getElementById('index-list');
            list.innerHTML = '';
            
            const filtered = allIndexes.filter(i => i.name.toLowerCase().includes(filter.toLowerCase()));
            
            if (allIndexes.length > 0) {
                 const tCount = allIndexes[0].availableTopicsCount || 0;
                 const topicInfo = document.createElement('div');
                 topicInfo.style.marginBottom = '10px';
                 topicInfo.style.fontSize = '12px';
                 topicInfo.style.color = '#555';
                 topicInfo.textContent = `Discovered ${tCount} total topics from registry.`;
                 list.appendChild(topicInfo);
            }

            filtered.forEach(idx => {
                const div = document.createElement('div');
                div.className = `index-item ${idx.isEvaluable ? 'evaluable' : 'catalog-only'} ${selectedIndex && selectedIndex.name === idx.name ? 'selected' : ''}`;
                div.innerHTML = `
                    <div>${idx.name} <span class="badge ${idx.isEvaluable ? 'evaluable' : 'catalog-only'}">${idx.isEvaluable ? 'Evaluable' : 'Catalog-only'}</span></div>
                    <div style="font-size: 12px; color: #555;">${idx.description}</div>
                `;
                div.onclick = () => selectIndex(idx);
                list.appendChild(div);
            });
        }

        function filterCatalog() {
            const filter = document.getElementById('search-box').value;
            renderCatalog(filter);
        }

        function selectIndex(idx) {
            selectedIndex = idx;
            renderCatalog(document.getElementById('search-box').value); // Update selection styling
            
            const pane = document.getElementById('details-pane');
            if (!idx.isEvaluable) {
                pane.innerHTML = `
                    <h2>${idx.name}</h2>
                    <p><strong>Type:</strong> ${idx.type}</p>
                    <p><strong>Description:</strong> ${idx.description}</p>
                    <p><em>This index is catalog-only and cannot be evaluated directly from this interface (missing known topic/qrels pairings).</em></p>
                `;
                return;
            }

            // Evaluable index
            let metricOptions = metrics.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
            
            pane.innerHTML = `
                <h2>${idx.name}</h2>
                <p><strong>Topics:</strong> ${idx.evalPairing.topics}</p>
                <p><strong>Qrels:</strong> ${idx.evalPairing.qrels}</p>
                
                <div style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #fafafa;">
                    <h3>Run Evaluation</h3>
                    <label>Select Metric: 
                        <select id="metric-select">
                            ${metricOptions}
                        </select>
                    </label>
                    <br><br>
                    <button id="run-btn" onclick="runEvaluation()">Run Evaluation</button>
                    <div id="eval-status" class="hidden"></div>
                </div>
                
                <div id="eval-results" class="hidden" style="margin-top: 20px;">
                    <h3>Evaluation Results</h3>
                    <p><strong>Score:</strong> <span id="eval-score" style="font-size: 24px; color: green;"></span></p>
                    <h4>Metadata</h4>
                    <ul id="eval-metadata"></ul>
                    <h4>Raw Output Preview</h4>
                    <pre id="eval-preview"></pre>
                </div>
            `;
        }

        async function runEvaluation() {
            if (!selectedIndex) return;
            
            const metric = document.getElementById('metric-select').value;
            const btn = document.getElementById('run-btn');
            const status = document.getElementById('eval-status');
            const results = document.getElementById('eval-results');
            
            btn.disabled = true;
            status.innerHTML = '<div class="loader">Running retrieval and evaluation... This may take a moment.</div>';
            status.classList.remove('hidden');
            results.classList.add('hidden');
            hideError();
            
            try {
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index: selectedIndex.name, metric })
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error + (data.details ? ': ' + data.details : ''));
                
                document.getElementById('eval-score').textContent = data.score;
                
                const meta = data.metadata;
                document.getElementById('eval-metadata').innerHTML = `
                    <li><strong>Index:</strong> ${meta.index}</li>
                    <li><strong>Topics:</strong> ${meta.topics}</li>
                    <li><strong>Metric:</strong> ${meta.metric}</li>
                    <li><strong>Status:</strong> ${meta.status}</li>
                    <li><strong>Elapsed Time:</strong> ${meta.elapsedTimeMs} ms</li>
                    <li><strong>Run File Path:</strong> ${meta.runFilePath}</li>
                    <li><strong>Eval Output Path:</strong> ${meta.evaluationOutputPath}</li>
                `;
                
                document.getElementById('eval-preview').textContent = meta.evaluationOutputPreview;
                
                results.classList.remove('hidden');
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                status.classList.add('hidden');
            }
        }

        function showError(msg) {
            const errDiv = document.getElementById('error-message');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');
        }

        function hideError() {
            const errDiv = document.getElementById('error-message');
            errDiv.classList.add('hidden');
        }

        // Init
        loadCatalog();
    </script>
</body>
</html>
